services:
  - type: web
    runtime: static
    name: footystats-review
    branch: main
    previews:
      generation: manual
    buildCommand: >-
      if [ "$IS_PULL_REQUEST" = "true" ]; then
        corepack enable && pnpm install --frozen-lockfile && pnpm build:review;
      else
        mkdir -p dist/footy-stats/browser &&
        printf '%s\n' '<title>FootyStats review</title><h1>FootyStats pull request previews</h1>'
        > dist/footy-stats/browser/index.html;
      fi
    staticPublishPath: ./dist/footy-stats/browser
    envVars:
      - key: NODE_VERSION
        value: '22.22.1'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
